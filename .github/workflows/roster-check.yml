name: Roster check
# Read-only: signs in anonymously with the public key (like any visitor) and lists the live hiker roster.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/roster-check.mjs
